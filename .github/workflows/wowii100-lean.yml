name: WOWII Conjecture 100 Lean check

on:
  push:
    branches:
      - research/wowii-conjecture-100-lean
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib and Formal Conjectures cache
        run: lake exe cache get
      - name: Kernel-check the project
        run: lake build
