name: WOWII Conjecture 100 Lean check

on:
  push:
    branches:
      - research/wowii-conjecture-100-lean
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib and Formal Conjectures cache
        run: lake exe cache get
      - name: Kernel-check the project
        run: lake build
