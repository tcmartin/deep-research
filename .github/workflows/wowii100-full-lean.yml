name: WOWII 100 full Lean proof

on:
  push:
    branches:
      - research/wowii-conjecture-100-full-lean
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: wowii100-lean427-mathlib-a3a10db-v1
      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and Mathlib cache
        run: lake update
      - name: Kernel-check proof
        run: lake build
